workflows:
  android-native-workflow:
    name: Android Native Workflow
    instance_type: mac_mini_m1
    scripts:
      - name: Generate Gradle Wrapper with specific version and Build APK
        script: |
          gradle wrapper --gradle-version 8.3.1
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
