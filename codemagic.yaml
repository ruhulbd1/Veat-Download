workflows:
  android-native-workflow:
    name: Android Native Workflow
    instance_type: mac_mini_m1
    scripts:
      - name: Use Gradle Wrapper from Project or Build
        script: |
          # যদি প্রজেক্টে gradlew ফাইল না থাকে তবে সঠিক গ্রেডল র‍্যাপার জেনারেট করে বিল্ড করা
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.3.1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - '**/build/outputs/apk/release/*.apk'
