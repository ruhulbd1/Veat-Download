workflows:
  android-native-workflow:
    name: Android Native Workflow
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android Release APK with Gradle
        script: |
          # যদি gradlew না থাকে তবে সরাসরি সিস্টেম gradle অথবা gradlew দিয়ে বিল্ড করার চেষ্টা করবে
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - '**/build/outputs/apk/release/*.apk'
