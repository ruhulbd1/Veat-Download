workflows:
  android-native-workflow:
    name: Android Native Workflow
    instance_type: mac_mini_m1
    scripts:
      - name: Install Correct Gradle 9.3.1 and Build APK
        script: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          
          # সাইনিং সমস্যা এড়াতে সরাসরি assembleRelease অথবা assembleDebug বিল্ড করা
          gradle assembleRelease -x lint
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk
      - '**/build/outputs/apk/**/*.apk'
