workflows:
  android-native-workflow:
    name: Android Native Workflow
    instance_type: mac_mini_m1
    scripts:
      - name: Install Correct Gradle 9.3.1 and Build Debug APK
        script: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          
          # রিলিজের বদলে ডিবাগ এপিকে বিল্ড করা (সাইনিং ফাইলের ঝামেলা ছাড়াই)
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - '**/build/outputs/apk/debug/*.apk'
